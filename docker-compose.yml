version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: django_postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - django_postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: django_web_app
    restart: always
    # Thêm sleep 3 giây để chờ Postgres sẵn sàng + sửa đúng đường dẫn myproject/manage.py
    command: >
      sh -c "sleep 3 &&
            python manage.py makemigrations &&
            python manage.py migrate &&
            python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  django_postgres_data: