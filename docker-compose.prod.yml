services:
  db:
    image: postgres:15-alpine
    container_name: django_postgres_db_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

  web:
    build: .
    container_name: django_app_prod
    restart: always
    command: >
      sh -c "python manage.py migrate &&
            python manage.py collectstatic --noinput &&
            gunicorn --bind 0.0.0.0:8000 --workers 3 myproject.wsgi:application"
    ports:
      # CHỈ mở cho localhost (127.0.0.1) trên VPS để Nginx của Host trỏ vào
      # Không public ra ngoài Internet (bảo mật tuyệt đối)
      - "127.0.0.1:8000:8000"
    volumes:
      # Mount ra thư mục trên host để Nginx của Host có thể phục vụ static/media trực tiếp
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    env_file:
      - .env.prod
    depends_on:
      - db

volumes:
  postgres_data_prod:
