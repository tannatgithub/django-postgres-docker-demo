# 1. Chuyển hướng HTTP sang HTTPS & Xử lý xác thực ACME của Let's Encrypt
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com; # Thay bằng domain thật của bạn

    # Cho phép Certbot xác thực quyền sở hữu domain qua HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Chuyển hướng tất cả request HTTP còn lại sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Cấu hình HTTPS (Port 443) với Let's Encrypt SSL
server {
    listen 443 ssl;
    server_name yourdomain.com www.yourdomain.com; # Thay bằng domain thật của bạn

    # Đường dẫn chứng chỉ do Certbot sinh ra
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # Cấu hình bảo mật SSL tối ưu
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20M;

    # Phục vụ static files
    location /static/ {
        alias /app/staticfiles/;
    }

    # Phục vụ media files
    location /media/ {
        alias /app/media/;
    }

    # Proxy tới Django (Gunicorn)
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
