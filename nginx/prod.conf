# 1. Port 80: Xử lý ACME challenge (Let's Encrypt) và chuyển hướng HTTP -> HTTPS
server {
    listen 80;
    server_name docker.letstuto.io.vn;

    # Cho phép Certbot xác thực cấp chứng chỉ
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Chuyển hướng toàn bộ HTTP còn lại sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Port 443: Xử lý HTTPS với chứng chỉ Let's Encrypt
server {
    listen 443 ssl;
    server_name docker.letstuto.io.vn;

    # Chứng chỉ Let's Encrypt được sinh ra từ Certbot volume
    ssl_certificate /etc/letsencrypt/live/docker.letstuto.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docker.letstuto.io.vn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20M;

    # Phục vụ static files trực tiếp từ volume bên trong container
    location /static/ {
        alias /app/staticfiles/;
    }

    # Phục vụ media files
    location /media/ {
        alias /app/media/;
    }

    # Chuyển tiếp request tới Gunicorn (Django)
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

