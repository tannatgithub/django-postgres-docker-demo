# 1. Chuyển hướng toàn bộ HTTP (Port 80) sang HTTPS (Port 443)
server {
    listen 80;
    server_name localhost 127.0.0.1;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Cấu hình HTTPS (Port 443) với SSL tự ký (Self-Signed)
server {
    listen 443 ssl;
    server_name localhost 127.0.0.1;

    # Đường dẫn file chứng chỉ SSL bên trong container (được mount từ máy host)
    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    # Cấu hình SSL protocols và ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    # Phục vụ file tĩnh (CSS/JS/Images)
    location /static/ {
        alias /app/staticfiles/;
    }

    # Phục vụ file media
    location /media/ {
        alias /app/media/;
    }

    # Chuyển tiếp request tới Gunicorn
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https; # Báo cho Django biết kết nối là HTTPS
    }
}
